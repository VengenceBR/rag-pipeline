[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Hybrid (dense + BM25 + cross-encoder rerank) RAG pipeline for company documents"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.2.0",
    "pinecone>=6.0.0",
    "bm25s>=0.2.0",
    "flashrank>=0.2.9",
    "langchain-text-splitters>=0.3.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer>=0.13.0",
    "numpy>=1.26.0",
    "tenacity>=9.0.0",
    "python-multipart>=0.0.12",
    "watchdog>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rag.api" = ["static/*.html", "static/*.js", "static/assets/*.png"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
