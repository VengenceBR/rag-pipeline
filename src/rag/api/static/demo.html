<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RAG Pipeline Demo</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f7f5;
    --panel: #ffffff;
    --border: #e3e2de;
    --text: #1f1e1c;
    --muted: #6b6a66;
    --accent: #2f6f4f;
    --accent-fg: #ffffff;
    --user-bubble: #eef1ee;
    --assistant-bubble: #ffffff;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  h1 {
    font-size: 18px;
    margin: 0;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-top: 2px;
  }
  .config {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .config label {
    font-size: 12px;
    color: var(--muted);
    display: block;
    margin-bottom: 4px;
  }
  .config .field { flex: 1; min-width: 160px; }
  input, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    color: var(--text);
  }
  .chat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    min-height: 360px;
    max-height: 55vh;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 90%; }
  .msg.user { align-self: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--user-bubble); }
  .msg.assistant .bubble { background: var(--assistant-bubble); border: 1px solid var(--border); }
  .msg.error .bubble { background: #fdecea; border: 1px solid #f3c8c4; color: var(--error); }
  .citations {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  form {
    display: flex;
    gap: 8px;
  }
  form input[type=text] { flex: 1; }
  button {
    padding: 8px 18px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: var(--accent-fg);
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .empty {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    margin: auto;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a;
      --panel: #201f22;
      --border: #33343a;
      --text: #ececec;
      --muted: #9a9a9a;
      --user-bubble: #2a3a2f;
      --assistant-bubble: #201f22;
      --accent: #4caf7d;
      --accent-fg: #0d150f;
      --error: #ff8a80;
    }
  }
</style>
</head>
<body>
<div class="app">
  <div>
    <h1>RAG Pipeline Demo</h1>
    <div class="subtitle">Talks directly to this server's /query endpoint, exactly like a real integration would.</div>
  </div>

  <div class="config">
    <div class="field">
      <label for="apiKey">X-API-Key</label>
      <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off">
    </div>
    <div class="field" style="flex: 0 0 140px;">
      <label for="companyId">Company ID</label>
      <input id="companyId" type="text" placeholder="acme">
    </div>
    <div class="field" style="flex: 0 0 130px;">
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="answer">answer</option>
        <option value="prompt">prompt</option>
      </select>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="empty" id="emptyState">Enter your API key and company ID above, then ask a question.</div>
  </div>

  <form id="form">
    <input id="input" type="text" placeholder="Ask a question about this company's docs..." autocomplete="off">
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
(() => {
  const chat = document.getElementById('chat');
  const emptyState = document.getElementById('emptyState');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const apiKeyEl = document.getElementById('apiKey');
  const companyEl = document.getElementById('companyId');
  const modeEl = document.getElementById('mode');

  // Convenience only: remembers your key/company for this browser so you don't
  // retype them each reload. This is a local trying-it-out page, not a real
  // customer-facing surface -- never ship raw API keys to a browser in production.
  try {
    apiKeyEl.value = localStorage.getItem('rag_demo_api_key') || '';
    companyEl.value = localStorage.getItem('rag_demo_company') || 'acme';
  } catch (e) {}

  function persist() {
    try {
      localStorage.setItem('rag_demo_api_key', apiKeyEl.value);
      localStorage.setItem('rag_demo_company', companyEl.value);
    } catch (e) {}
  }

  function addMessage(role, text, citations) {
    emptyState.remove();
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    if (citations && citations.length) {
      const cites = document.createElement('div');
      cites.className = 'citations';
      citations.forEach(c => {
        const line = document.createElement('div');
        const loc = c.page ? `${c.title}, p.${c.page}` : c.title;
        line.textContent = `${c.marker} ${loc} (${c.source_path})`;
        cites.appendChild(line);
      });
      wrap.appendChild(cites);
    }
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return wrap;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const query = input.value.trim();
    if (!query) return;
    persist();

    addMessage('user', query);
    input.value = '';
    sendBtn.disabled = true;

    const endpoint = modeEl.value === 'prompt' ? '/prompt' : '/query';
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-API-Key': apiKeyEl.value,
        },
        body: JSON.stringify({ query, company_id: companyEl.value }),
      });
      const data = await res.json();

      if (!res.ok) {
        addMessage('error', `${res.status} - ${data.detail || 'Request failed.'}`);
        return;
      }

      if (modeEl.value === 'prompt') {
        addMessage('assistant', data.prompt_package.user_prompt, data.citations);
      } else {
        addMessage('assistant', data.answer, data.citations);
      }
    } catch (err) {
      addMessage('error', 'Could not reach the server: ' + err.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
})();
</script>
</body>
</html>
